<link rel="stylesheet" href="/static/world/albedo/modules/a6.css?v=3">

<div class="a6-multiplicatio">
    <div class="schema-header">
        <div class="module-title">MULTIPLICATIO</div>
        
        <div class="dichotomy-wrapper">
            <span id="a6-label-harmonics" class="dicho-label active">Harmonics</span>
            <div class="toggle-switch" onclick="a6_toggleMultiplicatioMode()">
                <div class="toggle-knob" id="a6-mode-knob"></div>
            </div>
            <span id="a6-label-varga" class="dicho-label">Varga</span>
        </div>

        <div id="a6-sub-switch-container" class="dichotomy-wrapper" style="margin-top: 10px;">
            <span id="a6-label-positions" class="dicho-label active">Positions</span>
            <div class="toggle-switch" onclick="a6_toggleHarmonicView()">
                <div class="toggle-knob" id="a6-view-knob"></div>
            </div>
            <span id="a6-label-aspects" class="dicho-label">Aspects</span>
        </div>

        <!-- 🚀 [NEW] Varga 모드 전용 Amsa / Graha 서브 토글 -->
        <div id="a6-varga-sub-switch" class="dichotomy-wrapper" style="margin-top: 10px; display: none;">
            <span id="a6-label-amsa" class="dicho-label active">Amsa</span>
            <div class="toggle-switch" onclick="a6_toggleVargaView()">
                <div class="toggle-knob" id="a6-varga-view-knob"></div>
            </div>
            <span id="a6-label-graha" class="dicho-label">Graha</span>
        </div>

        <div id="a6-varga-controls" style="display: none; margin-top: 0px;">
            <nav class="ayanamsa-switch-module" id="a6-ayanamsa-nav-container">
                <button class="ayan-tab active" onclick="a6_switchAyanamsa('lahiri')">Lahiri</button>
                <button class="ayan-tab" onclick="a6_switchAyanamsa('raman')">Raman</button>
                <button class="ayan-tab" onclick="a6_switchAyanamsa('kp')">KP</button>
                <button class="ayan-tab" onclick="a6_switchAyanamsa('fagan-bradley')">Fagan-Bradley</button>
                <button class="ayan-tab" onclick="a6_switchAyanamsa('yukteswar')">Yukteswar</button>
            </nav>

            <!-- 🚀 [NEW] Amsa Grid (5x3) -->
            <div class="amsa-grid-container" id="a6-amsa-grid" style="display: none;"></div>
            
            <div class="graha-grid-container" id="a6-graha-grid"></div>
        </div>
    </div>

    <hr class="separator" style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <div id="a6-harmonic-wrapper">
        <div id="a6-view-harmonic-positions" class="content-view">
            <div class="h-scroll-view">
                <table class="n6-table">
                    <thead>
                        <tr>
                            <th class="sticky-col">Celestial Bodies</th>
                            <th>H1</th><th>H2</th><th>H3</th><th>H4</th><th>H5</th><th>H6</th>
                            <th>H7</th><th>H8</th><th>H9</th><th>H10</th><th>H11</th><th>H12</th>
                            <th>H16</th><th>H20</th><th>H24</th><th>H32</th>
                        </tr>
                    </thead>
                    <tbody id="a6-h-pos-body">
                        <!-- JS Render -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="a6-view-harmonic-aspects" class="content-view" style="display: none;">
            <div class="h-keyboard-grid" id="a6-h-btn-grid"></div>
            
            <div class="aspect-explorer">
                <div class="col-box" id="a6-col-h-bodies">
                    <div class="col-header">Celestial Bodies</div>
                    <div class="col-content" id="a6-list-h-bodies"></div>
                </div>
                <div class="col-box" id="a6-col-h-aspects">
                    <div class="col-header">Aspects</div>
                    <div class="col-content" id="a6-list-h-aspects"></div>
                </div>
                <div class="col-box" id="a6-col-h-objects">
                    <div class="col-header">Objects</div>
                    <div class="col-content" id="a6-list-h-objects">
                        <div style="text-align: center; color: #444; margin-top: 50px;">Select Body & Aspect</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🚀 ID를 graha 뷰 전용으로 분리 -->
    <div id="a6-view-varga-graha" class="content-view" style="display: none;">
        <div class="varga-table-container">
            <table class="n6-table varga-table">
                <colgroup>
                    <col style="width: 100px;">
                    <col style="width: 250px;">
                    <col style="width: 200px;">
                    <col style="width: auto;">
                </colgroup>
                <thead>
                    <tr>
                        <th>Division</th>
                        <th>Information</th>
                        <th>Nakshatra</th>
                        <th>Purushartha</th>
                    </tr>
                </thead>
                <tbody id="a6-varga-body">
                    <!-- JS Render -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 🚀 [NEW] Amsa View 전용 테이블 추가 -->
    <div id="a6-view-varga-amsa" class="content-view" style="display: none;">
        <div class="varga-table-container">
            <table class="n6-table varga-table">
                <colgroup>
                    <col style="width: 180px;">
                    <col style="width: 250px;">
                    <col style="width: auto;">
                </colgroup>
                <thead>
                    <tr>
                        <th class="sticky-col">Graha</th>
                        <th>Information</th>
                        <th>Nakshatra</th>
                    </tr>
                </thead>
                <tbody id="a6-varga-amsa-body">
                    <!-- JS Render -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/static/world/albedo/modules/a6.js?v=7"></script>
